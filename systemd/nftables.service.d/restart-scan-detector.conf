[Unit]
# Опційний drop-in: якщо на хості vendor-юніт nftables.service керує
# /etc/nftables.conf (окремо від нашої inet scanDetector) -- кожен його
# старт/рестарт виконує "flush ruleset" і накочує ТІЛЬКИ той файл, стираючи
# і нашу таблицю теж. Цей drop-in одразу після nftables.service підіймає
# scan-detector.service назад -- живий стан каскаду (scan/level*/srv_*)
# рестарт переживає, тож це не коштує втраченого прогресу.
#
# Встановлення (опційно, лише якщо nftables.service реально є на хості):
#   sudo install -D -m 644 systemd/nftables.service.d/restart-scan-detector.conf \
#       /etc/systemd/system/nftables.service.d/restart-scan-detector.conf
#   sudo systemctl daemon-reload

[Service]
# "-" на початку -- ігнорувати код виходу: якщо scan-detector.service ще не
# встановлено/не enabled, це не повинно валити сам nftables.service
ExecStartPost=-/usr/bin/systemctl restart scan-detector.service
