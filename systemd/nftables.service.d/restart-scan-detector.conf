[Unit]
# Опційний drop-in: якщо на хості vendor-юніт nftables.service керує
# /etc/nftables.conf (окремо від нашої inet scanDetector) -- кожен його
# старт/рестарт виконує "flush ruleset" і накочує ТІЛЬКИ той файл, стираючи
# і нашу таблицю теж (перевірено наживо в продакшн-інсталяції).
#
# ExecStartPre нижче знімає live-стан каскаду (scan/level*/srv_*) в
# /var/lib/nft-scandetect/live-state-pending.tsv і видаляє нашу таблицю ЩЕ
# ДО того, як vendor's flush це зробить сам (той самий шлях, що й
# "nft-scan-detector --stop"/ExecStop у scan-detector.service). Без цього
# кроку знімати після flush було б уже нічого -- ExecStartPost нижче
# перезапускає scan-detector.service вже ПІСЛЯ flush, коли таблиця й так
# порожня. ExecStartPre гарантує, що знімок береться РАНІШЕ.
#
# Встановлення (опційно, лише якщо nftables.service реально є на хості):
#   sudo install -D -m 644 systemd/nftables.service.d/restart-scan-detector.conf \
#       /etc/systemd/system/nftables.service.d/restart-scan-detector.conf
#   sudo systemctl daemon-reload

[Service]
# "-" на початку обох рядків -- ігнорувати код виходу: якщо
# nft-scan-detector/scan-detector.service ще не встановлено/не enabled, це
# не повинно валити сам nftables.service
ExecStartPre=-/usr/local/sbin/nft-scan-detector --stop
#
# --no-block ОБОВ'ЯЗКОВИЙ (не косметика): без нього -- дедлок на
# завантаженні системи. `systemctl restart` БЕЗ --no-block блокується,
# чекаючи завершення власної job scan-detector.service. Але
# scan-detector.service впорядкований `After=nftables.service` (див.
# systemd/scan-detector.service) -- тож systemd не дасть його job
# почати, поки job САМОГО nftables.service (у межах якого й виконується
# цей ExecStartPost) не завершиться. А вона не завершиться, поки не
# завершиться цей ExecStartPost. Класичне кругове очікування: nftables.
# service чекає на ExecStartPost, ExecStartPost чекає на job
# scan-detector.service, та job чекає на завершення nftables.service.
# Live-проявляється як підвішене завантаження (до TimeoutStartSec, типово
# 90s, на nftables.service, і так на кожному юніті, впорядкованому після
# нього). `--no-block` ставить job у черзі й одразу повертається без
# очікування -- ExecStartPost завершується миттєво, nftables.service
# стає active, і лише ТОДІ вже заблокована job scan-detector.service
# природно рушає далі. `try-restart` замість `restart` -- навмисно:
# якщо scan-detector.service ще не встиг піднятись сам (напр. це перший
# момент завантаження, до того, як дійшла черга власного `After=` у
# scan-detector.service), цей хук не повинен його "передчасно" стартувати
# -- це робота звичайного впорядкування, не цього ExecStartPost (чий сенс
# -- лише відновити стан ПІСЛЯ ручного/пізнішого рестарту nftables.service
# на вже працюючій системі, коли scan-detector.service і так уже active).
ExecStartPost=-/usr/bin/systemctl --no-block try-restart scan-detector.service
